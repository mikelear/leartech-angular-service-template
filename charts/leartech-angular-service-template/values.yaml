replicaCount: 1
image:
  repository: modernburro.azurecr.io/mikelear/leartech-angular-service-template
  tag: 0.0.44
  pullPolicy: IfNotPresent
service:
  name: leartech-angular-service-template
  type: ClusterIP
  port: 80
  externalPort: 80
# ---------------------------------------------------------------
# Ingress. Two shapes are supported:
#
#   1. Legacy single-host (via `jxRequirements.ingress.domain` +
#      `namespaceSubDomain`) — the default. Preview / staging / prod
#      helmfiles populate `jxRequirements` per-cluster and one Ingress
#      is rendered against `service.name<sub>.<domain>`. Keeps the
#      base template working without any chart-values changes.
#
#   2. Explicit multi-host list — set `ingress.hosts:` and the
#      chart binds the Ingress to every host in the list (with TLS
#      per host). Use this when a single deployment fronts several
#      canonical domains (marketing site + product domain, alias
#      redirects, etc.). Example:
#
#      ingress:
#        hosts:
#          - host: www.example.com
#            tlsSecret: tls-www-example-p
#          - host: example.com
#            tlsSecret: tls-example-p
#
# WHATEVER shape is used, `seo.canonicalHost` MUST be a single
# domain. With multiple served hosts, one must be the canonical
# (crawlers treat the copies as duplicate content otherwise).
# ---------------------------------------------------------------
ingress:
  annotations: {}
  pathType: ImplementationSpecific
  labels: {}
  # Explicit multi-host list. Empty → fall back to the single-host
  # jxRequirements-driven path below. When set, this overrides
  # jxRequirements.ingress.domain completely.
  hosts: []
# jxRequirements — auto-populated from jx-values.yaml per cluster/env.
# Do NOT hardcode domains here. Preview gets domain from jx preview create,
# staging/prod from the GitOps helmfile jx-values.yaml.
jxRequirements:
  ingress:
    annotations: {}
    apiVersion: "networking.k8s.io/v1"
    domain: ""
    externalDNS: false
    namespaceSubDomain: -jx.
    serviceType: ""
    tls:
      email: ""
      enabled: false
      production: false
      secretName: ""
knativeDeploy: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
jx:
  releasedByJX: true
# ---------------------------------------------------------------
# SEO configuration.
#
# canonicalHost is the SINGLE canonical URL crawlers should treat
# as the source of truth for content served by this deployment.
# Rewritten into every served HTML / robots.txt / sitemap.xml at
# container start (see nginx/docker-entrypoint.d/40-canonical-host.sh
# in the Dockerfile).
#
# MUST include the scheme (`https://example.com`, NOT `example.com`).
# Trailing slash is stripped automatically by the entrypoint.
#
# Preview values.yaml.gotmpl deliberately leaves this at the prod
# domain — SEO discovery is a prod-only concern; the preview
# crawlability check asserts presence + structure, not host equality.
# If left empty, the __CANONICAL_HOST__ placeholder remains in place
# (fine for local `docker run` / early-iteration previews).
# ---------------------------------------------------------------
seo:
  canonicalHost: ""
# Runtime config served at /api.conf.json — populated per-environment in
# preview helmfile / staging / prod values files. See
# hub/shared-rules/conventions.md § Frontend runtime config.
# Consumers replace / extend keys here with their service's runtime knobs.
config:
  # api: unused on the template (no own backend); cloned services that
  # talk to a single backend point this at it. Fleet-status reads its
  # peer URLs from `peers` below — keyed by service name → base URL.
  api: ""
  # OIDC auth wiring. `clientId` matches the registered OAuth2 client in
  # leartech-auth-service (frontend-services). `authority` points at the
  # cluster's Hydra. `audiences[]` is forwarded as `audience=` on
  # /oauth2/authorize per RFC 8707 — Hydra populates the issued token's
  # `aud` claim so each backend's AuthLayer validates its own service
  # name. See @mikelear/leartech-common provideLeartechAuth.
  auth:
    clientId: frontend-services
    authority: ""
    scope: "openid profile email leartechapi offline"
    audiences:
    - leartech-rust-service-template
    - leartech-go-service-template
    - leartech-dotnet-service-template
  # Peer service base URLs — fleet-status reads these instead of
  # composing them in source. Cloned services replace this with the
  # actual peers their UI consumes.
  peers:
    leartech-rust-service-template: ""
    leartech-go-service-template: ""
    leartech-dotnet-service-template: ""
  featureFlags: {}
