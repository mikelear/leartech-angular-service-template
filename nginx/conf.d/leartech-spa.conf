# leartech-nginx SPA config with prerender-aware serving.
#
# The default leartech-nginx `try_files $uri $uri/ /index.html` fallback
# serves the ROOT index.html for every deep-link — which defeats
# prerender (`/fleet-status` would then serve the CSR shell instead of
# `/fleet-status/index.html`, killing SEO for that route).
#
# This config tries, in order:
#   1. $uri              — an exact file (e.g. `/scripts/main.js`)
#   2. $uri/index.html   — a route's prerendered index.html
#      (`/fleet-status` → `/fleet-status/index.html`)
#   3. /index.html       — SPA fallback for Client-mode / unknown
#                          routes (the CSR shell then hydrates and
#                          renders the correct component)
#
# Same server-block shape as the base image — port 8080, uid 101,
# gzip on, 1y immutable cache on hashed static assets. `/health`
# stays as a plain 200 for k8s probes.

server {
    listen       8080 default_server;
    listen  [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # k8s probes — plain JSON 200 regardless of app state.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }

    # Static assets — hashed filenames, immutable cache. Angular's
    # `outputHashing: "all"` puts a content hash into every asset
    # name so this is safe.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SEO / crawler files — served with their canonical URL rewritten
    # by the entrypoint (envsubst against $CANONICAL_HOST).
    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    # HTML routing:
    #   /               → /index.html                       (prerendered)
    #   /fleet-status   → /fleet-status/index.html          (prerendered)
    #   /app/dashboard  → /index.html                       (SPA fallback)
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
