apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  creationTimestamp: null
  name: test
spec:
  pipelineSpec:
    tasks:
    - name: ng-test
      resources: {}
      taskSpec:
        metadata: {}
        stepTemplate:
          image: uses:mikelear/leartech-pipeline-catalog/tasks/ng-test/pullrequest.yaml@main
          name: ""
          resources: {}
          workingDir: /workspace/source
          # The template now ships real specs for every component/service
          # (app, landing, fleet-status, auth-callback, seo). 60% is the floor a
          # clone starts above, so a consumer's first PR cannot regress below it.
          env:
          - name: COVERAGE_THRESHOLD
            value: "60.0"
        steps:
        - name: ""
          resources: {}
  podTemplate:
    tolerations:
    - key: sku
      operator: Equal
      value: build
      effect: NoSchedule
  serviceAccountName: tekton-bot
  timeout: 1h0m0s
status: {}
